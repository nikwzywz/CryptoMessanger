[profile.default]
src = "contracts"
test = "contracts/test"
out = "contracts/out"
libs = ["contracts/lib"]
solc = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2

# Cache and broadcast directories
cache_path = "contracts/cache"
broadcast = "contracts/broadcast"

# RPC endpoints
[rpc_endpoints]
base = "https://mainnet.base.org"
baseSepolia = "https://sepolia.base.org"
polygon = "https://polygon.rpc.subquery.network/public"  # 0.167s latency
# Alternative Polygon RPCs (sorted by latency):
# polygon = "https://rpc-mainnet.matic.quiknode.pro"      # 0.186s (requires API key)
# polygon = "https://polygon.api.onfinality.io/public"    # 0.190s
# polygon = "https://polygon-mainnet.g.alchemy.com/v2/demo"  # 0.240s
local = "http://localhost:8545"

# Etherscan V2 API - единый ключ для всех сетей
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api" }
baseSepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api" }
polygon = { key = "${ETHERSCAN_API_KEY}", url = "https://api.polygonscan.com/api" }

# Gas reports
[profile.gas]
gas_reports = ["*"]

# Test configuration
[profile.test]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 15 }

# Deployment configuration
[profile.deploy]
optimizer = true
optimizer_runs = 1000
via_ir = true
