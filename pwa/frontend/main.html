<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoMessenger - Децентрализованный мессенджер</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Боковая панель с контактами */
        .sidebar {
            width: 320px;
            background: #1a1a1a;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            background: #1a1a1a;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .sidebar-subtitle {
            font-size: 14px;
            color: #888;
        }

        .search-box {
            margin-top: 16px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-input:focus {
            outline: none;
            border-color: #007bff;
        }

        /* Список контактов */
        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
            border-bottom: 1px solid #222;
        }

        .contact-item:hover {
            background: #2a2a2a;
        }

        .contact-item.active {
            background: #007bff;
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-last-message {
            font-size: 14px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-left: 8px;
        }

        .contact-time {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .contact-badge {
            background: #007bff;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* Статусы запросов */
        .contact-item.incoming-request {
            border-left: 3px solid #28a745;
        }

        .contact-item.outgoing-request {
            border-left: 3px solid #ffc107;
        }

        .contact-item.incoming-request .contact-name::after {
            content: " (Входящий запрос)";
            color: #28a745;
            font-size: 12px;
        }

        .contact-item.outgoing-request .contact-name::after {
            content: " (Исходящий запрос)";
            color: #ffc107;
            font-size: 12px;
        }

        /* Область чата */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            background: #1a1a1a;
            display: flex;
            align-items: center;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 12px;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .chat-status {
            font-size: 14px;
            color: #888;
        }

        .chat-actions {
            display: flex;
            gap: 8px;
        }

        .chat-action-btn {
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .chat-action-btn:hover {
            background: #3a3a3a;
        }

        .chat-action-btn.primary {
            background: #007bff;
            border-color: #007bff;
        }

        .chat-action-btn.primary:hover {
            background: #0056b3;
        }

        .chat-action-btn.danger {
            background: #dc3545;
            border-color: #dc3545;
        }

        .chat-action-btn.danger:hover {
            background: #c82333;
        }

        /* Область сообщений */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #0a0a0a;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }

        .message.outgoing {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            margin: 0 8px;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 70%;
            background: #2a2a2a;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        .message.outgoing .message-content {
            background: #007bff;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 12px;
            color: #888;
            text-align: right;
        }

        .message.outgoing .message-time {
            color: rgba(255, 255, 255, 0.7);
        }

        .message.system {
            justify-content: center;
            margin: 20px 0;
        }

        .message.system .message-content {
            background: #333;
            color: #888;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 12px;
        }

        /* Поле ввода */
        .input-area {
            padding: 20px;
            border-top: 1px solid #333;
            background: #1a1a1a;
        }

        .input-container {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            min-height: 44px;
            max-height: 120px;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 22px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .message-input::placeholder {
            color: #666;
        }

        .send-button {
            width: 44px;
            height: 44px;
            background: #007bff;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background: #0056b3;
        }

        .send-button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }
            
            .chat-area {
                display: none;
            }
            
            .app-container.mobile-chat .sidebar {
                display: none;
            }
            
            .app-container.mobile-chat .chat-area {
                display: flex;
            }
        }

        /* Скроллбар */
        .contacts-list::-webkit-scrollbar,
        .messages-area::-webkit-scrollbar {
            width: 6px;
        }

        .contacts-list::-webkit-scrollbar-track,
        .messages-area::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .contacts-list::-webkit-scrollbar-thumb,
        .messages-area::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        .contacts-list::-webkit-scrollbar-thumb:hover,
        .messages-area::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* Анимации */
        .contact-item {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message {
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Стили для статистики чата */
        .chat-stats {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }

        .chat-stats-item {
            display: inline-block;
            margin-right: 16px;
        }

        .chat-stats-item strong {
            color: #4CAF50;
        }

        /* Стили для индикатора загрузки истории */
        .history-loading {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 14px;
        }

        .history-loading .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #333;
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        /* Стили для кнопки "Назад" */
        .back-button {
            display: none;
            margin-right: 12px;
            padding: 8px;
            background: #2a2a2a;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        .back-button:hover {
            background: #3a3a3a;
        }

        /* Стили для кнопок действий */
        .action-button {
            padding: 8px 12px;
            background: #2a2a2a;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .action-button:hover {
            background: #3a3a3a;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .back-button {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Боковая панель с контактами -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">CryptoMessenger</div>
                <div class="sidebar-subtitle">Децентрализованный мессенджер</div>
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="Поиск контактов...">
                </div>
            </div>
            
            <div class="contacts-list" id="contactsList">
                <!-- Контакты будут загружены динамически из блокчейна -->
                <div class="contact-item" style="text-align: center; padding: 20px; color: #888;">
                    <div class="contact-info">
                        <div class="contact-name">Загрузка контактов...</div>
                        <div class="contact-last-message">Подключение к блокчейну</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Область чата -->
        <div class="chat-area">
            <div class="chat-header">
                <button class="back-button" id="backButton">←</button>
                <div>
                    <div class="chat-title" id="chatTitle">Выберите контакт</div>
                    <div class="chat-subtitle" id="chatSubtitle">Начните общение</div>
                    <div class="chat-stats" id="chatStats" style="display: none;">
                        <span class="chat-stats-item">
                            <strong id="totalMessages">0</strong> сообщений
                        </span>
                        <span class="chat-stats-item">
                            <strong id="loadedMessages">0</strong> загружено
                        </span>
                        <span class="chat-stats-item">
                            <strong id="isFullyLoaded">Нет</strong> история
                        </span>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="action-button" id="loadHistoryBtn" style="display: none;">📚 История</button>
                    <button class="action-button" id="refreshBtn" style="display: none;">🔄 Обновить</button>
                </div>
            </div>

            <div class="messages-area">
                <div class="messages-container" id="chat-messages">
                    <div class="message incoming">
                        <div class="message-content">
                            <div class="message-text">Добро пожаловать в CryptoMessenger! Выберите контакт для начала общения.</div>
                            <div class="message-time">Система</div>
                        </div>
                    </div>
                </div>
                
                <div class="history-loading" id="historyLoading" style="display: none;">
                    <div class="spinner"></div>
                    Загружаем историю...
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea class="message-input" id="messageInput" placeholder="Введите сообщение..." rows="1"></textarea>
                    <button class="send-button" id="sendButton">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключение библиотек -->
    <script src="lib/web3.min.js"></script>
    <script src="lib/crypto-js.min.js"></script>
    <script src="config.js"></script>
    <script src="lib/decentralized-event-system-browser.js"></script>
    <script src="lib/chat-ui-manager.js"></script>
    
    <script>
        // CryptoMessenger v2.0.0 - Main Interface with Pagination and Real-time Updates
        console.log('CryptoMessenger v2.0.0 - Main Interface Loaded with Pagination and Real-time Updates');
        
        // Глобальные переменные
        let web3;
        let contract;
        let currentUser;
        let userPrivateKey;
        let userPublicKey;
        let contacts = [];
        let currentContact = null;
        let chatUIManager;
        let eventSystem;
        let contactRequests = [];
        let messages = {};
        
        // Альтернативные RPC endpoints (актуальные рабочие)
        const RPC_ENDPOINTS = [
            'https://base.rpc.subquery.network/public',  // 0.097s - самый быстрый
            'https://base-rpc.publicnode.com',           // 0.157s
            'https://base.api.onfinality.io/public',     // 0.194s
            'https://base.therpc.io',                    // 0.213s
            'https://mainnet.base.org',                  // 0.209s - официальный
            'https://base.drpc.org',                     // 0.255s
            'https://base.lava.build',                   // 0.267s
            'https://api.zan.top/base-mainnet',          // 0.298s
            'https://base.public.blockpi.network/v1/rpc/public', // 0.299s
            'https://1rpc.io/base'                       // 0.229s
        ];
        let currentRpcIndex = 0;
        
        // Инициализация Web3 и контракта
        async function initializeWeb3() {
            try {
                // Проверяем, что конфигурация загружена
                if (!window.CryptoMessengerConfig) {
                    throw new Error('Конфигурация не загружена. Убедитесь, что config.js подключен.');
                }
                
                console.log('📋 Конфигурация найдена:', {
                    contractAddress: window.CryptoMessengerConfig.contractAddress,
                    abiLength: window.CryptoMessengerConfig.contractABI.length
                });
                
                // Проверяем наличие Web3 провайдера
                if (typeof window.ethereum !== 'undefined') {
                    web3 = new Web3(window.ethereum);
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                } else {
                    // Fallback для тестирования - используем первый доступный RPC
                    web3 = new Web3(RPC_ENDPOINTS[currentRpcIndex]);
                    console.warn(`MetaMask не найден, используется RPC: ${RPC_ENDPOINTS[currentRpcIndex]}`);
                }
                
                // Создаем экземпляр контракта
                contract = new web3.eth.Contract(window.CryptoMessengerConfig.contractABI, window.CryptoMessengerConfig.contractAddress);
                console.log('✅ Web3 и контракт инициализированы');
                console.log('📋 Адрес контракта:', window.CryptoMessengerConfig.contractAddress);
                
                return true;
            } catch (error) {
                console.error('❌ Ошибка инициализации Web3:', error);
                return false;
            }
        }
        
        // Загрузка данных пользователя
        async function loadUserData() {
            try {
                // Получаем текущий аккаунт
                const accounts = await web3.eth.getAccounts();
                if (accounts.length === 0) {
                    console.error('❌ Аккаунт не подключен');
                    return false;
                }
                
                currentUser = accounts[0];
                console.log('👤 Текущий пользователь:', currentUser);
                
                // Проверяем регистрацию пользователя
                const isRegistered = await contract.methods.isUserRegistered(currentUser).call();
                if (!isRegistered) {
                    console.error('❌ Пользователь не зарегистрирован в контракте');
                    return false;
                }
                
                // Получаем публичный ключ пользователя
                userPublicKey = await contract.methods.getPublicKey(currentUser).call();
                console.log('🔑 Публичный ключ пользователя:', userPublicKey);
                
                return true;
            } catch (error) {
                console.error('❌ Ошибка загрузки данных пользователя:', error);
                return false;
            }
        }
        
        // Загрузка контактов из блокчейна
        async function loadContacts() {
            try {
                console.log('📞 Загружаем контакты из блокчейна...');
                
                // Получаем все контакты пользователя
                const contactAddresses = await contract.methods.getUserContacts(currentUser).call();
                console.log('📋 Найдено контактов:', contactAddresses.length);
                
                contacts = [];
                
                for (const address of contactAddresses) {
                    try {
                        // Получаем публичный ключ контакта
                        const contactPublicKey = await contract.methods.getPublicKey(address).call();
                        
                        // Получаем последнее сообщение в чате
                        const lastMessage = await getLastMessage(currentUser, address);
                        
                        contacts.push({
                            address: address,
                            name: `User ${address.slice(2, 6)}`, // Короткое имя из адреса
                            publicKey: contactPublicKey,
                            lastMessage: lastMessage ? lastMessage.text : 'Нет сообщений',
                            lastMessageTime: lastMessage ? lastMessage.timestamp : null,
                            isOnline: false // Пока не реализовано
                        });
                    } catch (error) {
                        console.warn('⚠️ Ошибка загрузки контакта:', address, error);
                    }
                }
                
                console.log('✅ Контакты загружены:', contacts.length);
                
                // Детальная информация о контактах
                if (contacts.length > 0) {
                    console.log('📋 Детали контактов:');
                    contacts.forEach((contact, index) => {
                        console.log(`   ${index + 1}. ${contact.name} (${contact.address})`);
                        console.log(`      🔑 Публичный ключ: ${contact.publicKey.slice(0, 20)}...`);
                        console.log(`      💬 Последнее сообщение: ${contact.lastMessage}`);
                        console.log(`      ⏰ Время: ${contact.lastMessageTime ? formatTime(contact.lastMessageTime) : 'Нет'}`);
                    });
                } else {
                    console.log('📋 Контакты не найдены');
                }
                
                return contacts;
            } catch (error) {
                console.error('❌ Ошибка загрузки контактов:', error);
                return [];
            }
        }
        
        // Загрузка запросов на добавление в контакты
        async function loadContactRequests() {
            try {
                console.log('📨 Загружаем запросы на добавление в контакты...');
                
                // Пока что возвращаем пустые списки, так как в контракте нет методов для получения списков запросов
                // TODO: Добавить методы в контракт для получения списков запросов
                contactRequests = {
                    incoming: [],
                    outgoing: []
                };
                
                console.log('✅ Запросы загружены (пока пустые):', {
                    incoming: contactRequests.incoming.length,
                    outgoing: contactRequests.outgoing.length
                });
                
                return contactRequests;
            } catch (error) {
                console.error('❌ Ошибка загрузки запросов:', error);
                return { incoming: [], outgoing: [] };
            }
        }
        
        // Инициализация децентрализованной системы событий
        
        // Функция расшифровки сообщений
        function decryptMessage(encryptedMessage, sender, recipient) {
            try {
                // Получаем ключи шифрования из localStorage
                const storedKeys = localStorage.getItem('cryptoMessengerKeys');
                if (!storedKeys) {
                    console.warn('🔑 Ключи шифрования не найдены в localStorage');
                    return `[Ключи не найдены: ${encryptedMessage.slice(0, 20)}...]`;
                }
                
                const encryptionKeys = JSON.parse(storedKeys);
                const privateKeyForEncode = encryptionKeys.privateKeyForEncode;
                
                if (!privateKeyForEncode) {
                    console.warn('🔑 PrivateKeyForEncode не найден');
                    return `[Ключ не найден: ${encryptedMessage.slice(0, 20)}...]`;
                }
                
                // В тестовых данных используется простое hex-кодирование
                // Убираем '0x' префикс и декодируем
                const hexData = encryptedMessage.startsWith('0x') ? encryptedMessage.slice(2) : encryptedMessage;
                
                try {
                    // Пытаемся декодировать как hex (браузерная версия)
                    const decryptedBytes = new Uint8Array(hexData.length / 2);
                    for (let i = 0; i < hexData.length; i += 2) {
                        decryptedBytes[i / 2] = parseInt(hexData.substr(i, 2), 16);
                    }
                    
                    // Конвертируем в строку
                    const decryptedText = new TextDecoder('utf-8').decode(decryptedBytes);
                    
                    // Проверяем, что получили читаемый текст
                    if (decryptedText && decryptedText.length > 0 && !decryptedText.includes('\0')) {
                        console.log('✅ Сообщение расшифровано:', decryptedText);
                        return decryptedText;
                    } else {
                        throw new Error('Нечитаемый текст');
                    }
                } catch (hexError) {
                    // Если не получилось как hex, пробуем как base64
                    try {
                        const decryptedBytes = Uint8Array.from(atob(hexData), c => c.charCodeAt(0));
                        const decryptedText = new TextDecoder('utf-8').decode(decryptedBytes);
                        console.log('✅ Сообщение расшифровано (base64):', decryptedText);
                        return decryptedText;
                    } catch (base64Error) {
                        console.warn('❌ Не удалось расшифровать сообщение:', hexError.message, base64Error.message);
                        return `[Не удалось расшифровать: ${encryptedMessage.slice(0, 20)}...]`;
                    }
                }
                
            } catch (error) {
                console.error('❌ Ошибка расшифровки:', error);
                return `[Ошибка расшифровки: ${encryptedMessage.slice(0, 20)}...]`;
            }
        }
        
        // Загрузка сообщений для конкретного чата с децентрализованной системой
        async function loadMessages(contactAddress, retryCount = 0) {
            try {
                console.log('💬 Загружаем сообщения для:', contactAddress, retryCount > 0 ? `(попытка ${retryCount + 1})` : '');
                
                // Инициализируем систему событий если еще не инициализирована
                if (!eventSystem) {
                    eventSystem = new DecentralizedEventSystem();
                    console.log('🚀 Децентрализованная система событий инициализирована');
                }
                
                // Загружаем сообщения через децентрализованную систему
                // Для тестовых данных используем конкретный диапазон блоков
                const loadedMessages = await eventSystem.loadMessagesBetweenUsers(currentUser, contactAddress, {
                    fromBlock: 35464000,
                    toBlock: 35464999
                });
                
                // Преобразуем в формат для UI
                const chatMessages = loadedMessages.map(msg => ({
                    sender: msg.sender,
                    recipient: msg.recipient,
                    encryptedMessage: msg.encryptedData,
                    timestamp: new Date(parseInt(msg.timestamp) * 1000),
                    blockNumber: msg.blockNumber,
                    transactionHash: msg.transactionHash
                })).sort((a, b) => a.timestamp - b.timestamp);
                
                // Расшифровываем сообщения
                const decryptedMessages = chatMessages.map(msg => {
                    const decryptedText = decryptMessage(msg.encryptedMessage, msg.sender, msg.recipient);
                    return {
                        ...msg,
                        text: decryptedText,
                        isOutgoing: msg.sender === currentUser
                    };
                });
                
                messages[contactAddress] = decryptedMessages;
                console.log('✅ Сообщения загружены через децентрализованную систему:', decryptedMessages.length);
                console.log('💾 Сохранено в глобальную переменную messages:', messages[contactAddress].length);
                
                return decryptedMessages;
            } catch (error) {
                // Обрабатываем ошибки сети (503, rate limit и т.д.)
                if (error.message && (error.message.includes('503') || error.message.includes('Request failed'))) {
                    console.log(`ℹ️ Сервер временно недоступен при загрузке сообщений (503) - попытка ${retryCount + 1}`);
                    
                    // Retry логика - максимум 2 попытки
                    if (retryCount < 2) {
                        console.log('🔄 Повторяем попытку через 2 секунды...');
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        return await loadMessages(contactAddress, retryCount + 1);
                    } else {
                        console.log('📝 Максимум попыток исчерпан, показываем пустой чат');
                        console.log('ℹ️ Примечание: В тестовых данных у user02 должно быть 5 сообщений с user05');
                        messages[contactAddress] = [];
                        return [];
                    }
                } else {
                    console.error('❌ Ошибка загрузки сообщений:', error);
                    messages[contactAddress] = [];
                    return [];
                }
            }
        }
        
        // Получение последнего сообщения в чате
        async function getLastMessage(user1, user2) {

                    },
                    fromBlock: 0,
                    toBlock: 'latest'

                if (messageEvents.length === 0) return null;
                
                const lastEvent = messageEvents[messageEvents.length - 1];

                    text: `[Зашифровано: ${lastEvent.returnValues.encryptedMessage.slice(0, 20)}...]`,
                    timestamp: new Date(parseInt(lastEvent.returnValues.timestamp) * 1000)

            }
        }

        // Форматирование времени
        function formatTime(timestamp) {
            const now = new Date();
            const messageTime = new Date(timestamp);
            const diff = now - messageTime;
            
            if (diff < 60000) { // Меньше минуты
                return 'только что';
            } else if (diff < 3600000) { // Меньше часа
                return `${Math.floor(diff / 60000)} мин назад`;
            } else if (diff < 86400000) { // Меньше дня
                return messageTime.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            } else if (diff < 604800000) { // Меньше недели
                return messageTime.toLocaleDateString('ru-RU', { weekday: 'short' });
            } else {
                return messageTime.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            }
        }

                if (accounts.length === 0) {
                    console.log('🔌 Кошелек отключен');
                    showNotification('Кошелек отключен! Перенаправляем на страницу авторизации...', 'warning');
                    
                    // Перенаправляем на страницу авторизации
                    setTimeout(() => {
                        window.location.href = 'auth-v2.html';
                    }, 2000);
                } else if (accounts[0] !== currentUser) {
                    console.log('🔄 Аккаунт изменен');
                    currentUser = accounts[0];
                    location.reload(); // Перезагружаем страницу
                }
            });

            // Слушаем изменения сети
            window.ethereum.on('chainChanged', (chainId) => {
                console.log('🔄 Сеть изменена:', chainId);
                location.reload(); // Перезагружаем страницу
            });
        }

        // Выбор контакта
        async function selectContact(contactAddress) {
            try {
                console.log('💬 Выбираем контакт:', contactAddress);
                
                // Обновляем активный контакт
                document.querySelectorAll('.contact-item').forEach(item => {
                    item.classList.remove('active');
                });
                document.querySelector(`[data-address="${contactAddress}"]`).classList.add('active');

                // Закрываем боковую панель на мобильных
                document.getElementById('sidebar').classList.remove('open');

                // Обновляем заголовок чата
                const contact = contacts.find(c => c.address === contactAddress);
                document.getElementById('chatTitle').textContent = contact.name;
                document.getElementById('chatSubtitle').textContent = contact.address;
                
                // Показываем кнопки действий
                document.getElementById('loadHistoryBtn').style.display = 'inline-block';
                document.getElementById('refreshBtn').style.display = 'inline-block';

                // Открываем чат
                currentContact = contactAddress;
                await chatUIManager.openChat(contactAddress, onNewMessage, onHistoryLoaded);

                // Обновляем статистику
                updateChatStats();

                console.log('✅ Чат открыт с контактом:', contactAddress);

            } catch (error) {
                console.error('❌ Ошибка выбора контакта:', error);
                showNotification('Ошибка открытия чата: ' + error.message, 'error');
            }
        }

        // Обработка новых сообщений
        function onNewMessage(newMessages, event) {
            console.log('📨 Получено новое сообщение:', newMessages.length);
            showNotification(`Получено ${newMessages.length} новых сообщений`, 'success');
        }

        // Обработка загрузки истории
        function onHistoryLoaded(pageMessages, startIndex) {
            console.log('📚 Загружена страница истории:', pageMessages.length, 'сообщений, начиная с', startIndex);
        }

        // Загрузка истории чата
        async function loadChatHistory() {
            if (!currentContact) return;

            try {
                console.log('📚 Загружаем историю чата...');
                
                // Показываем индикатор загрузки
                const historyLoading = document.getElementById('historyLoading');
                historyLoading.style.display = 'block';

                await chatUIManager.loadChatHistory(currentContact);

                // Скрываем индикатор загрузки
                historyLoading.style.display = 'none';

                // Обновляем статистику
                updateChatStats();

                showNotification('История чата загружена', 'success');

            } catch (error) {
                console.error('❌ Ошибка загрузки истории:', error);
                showNotification('Ошибка загрузки истории: ' + error.message, 'error');
                
                // Скрываем индикатор загрузки
                document.getElementById('historyLoading').style.display = 'none';
            }
        }

        // Обновление чата
        async function refreshChat() {
            if (!currentContact) return;

            try {
                console.log('🔄 Обновляем чат...');
                
                const newMessages = await chatUIManager.checkForNewMessages(currentContact);
                
                if (newMessages.length > 0) {
                    showNotification(`Загружено ${newMessages.length} новых сообщений`, 'success');
                    updateChatStats();
                } else {
                    showNotification('Новых сообщений нет', 'info');
                }

            } catch (error) {
                console.error('❌ Ошибка обновления чата:', error);
                showNotification('Ошибка обновления: ' + error.message, 'error');
            }
        }

        // Обновление статистики чата
        function updateChatStats() {
            if (!currentContact) return;

            const stats = chatUIManager.getChatStats(currentContact);
            const chatStats = document.getElementById('chatStats');
            
            document.getElementById('totalMessages').textContent = stats.totalMessages;
            document.getElementById('loadedMessages').textContent = stats.loadedMessages;
            document.getElementById('isFullyLoaded').textContent = stats.isFullyLoaded ? 'Да' : 'Нет';
            
            chatStats.style.display = 'block';
        }

        // Отправка сообщения
        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const messageText = messageInput.value.trim();
            
            if (!messageText || !currentContact) return;

            try {
                console.log('📤 Отправляем сообщение:', messageText);
                
                // Пока что просто очищаем поле ввода
                messageInput.value = '';
                messageInput.style.height = 'auto';
                
                showNotification('Отправка сообщений пока не реализована', 'warning');

            } catch (error) {
                console.error('❌ Ошибка отправки сообщения:', error);
                showNotification('Ошибка отправки: ' + error.message, 'error');
            }
        }

        // Показ уведомлений
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // Показываем уведомление
            setTimeout(() => notification.classList.add('show'), 100);
            
            // Скрываем через 3 секунды
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => document.body.removeChild(notification), 300);
            }, 3000);
        }

        // Инициализация
        addBackButton();
        window.addEventListener('resize', addBackButton);
        
        // Запускаем инициализацию приложения с небольшой задержкой
        console.log('🚀 Запускаем инициализацию приложения...');
        setTimeout(() => {
            initializeApp();
        }, 100); // Небольшая задержка для загрузки config.js
    </script>
</body>
</html>
